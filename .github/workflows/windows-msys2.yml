name: Windows MSYS2 (experiment)

# Experiment: build and test flint on Windows with MSYS2 (mingw-w64,
# FLINT from pacman), and check whether mlcuddidl (needed by colibri2)
# and a pure OCaml BDD library (mlbdd) build there.

on:
  push:
    branches:
      - bobot/agent/camlid-flint/msys2
  workflow_dispatch:

jobs:
  msys2:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # As in opam-repository's windows.yml: drop the runner's extra
      # toolchains (Strawberry Perl's gcc, chocolatey's pkg-config, ...)
      # so that opam only sees the MSYS2 ones.
      - name: Prune PATH
        run: |
          $exclude = @('Strawberry', 'chocolatey', 'OpenSSL', 'vcpkg',
                       'mingw64', 'LLVM', 'Git\bin', 'Git\usr', 'CMake')
          $kept = @()
          foreach ($dir in $env:PATH -split ';' | Where-Object { $_ }) {
            if ($exclude | Where-Object { $dir -like "*$_*" }) {
              Write-Host "Dropping  $dir"
            } else {
              $kept += $dir
            }
          }
          "PATH=$($kept -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Use OCaml 5 with MSYS2
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5"
          windows-environment: msys2
          opam-pin: false

      # opam's mingw OCaml uses the MINGW64 environment of MSYS2
      # (conf-mingw-w64-gcc-x86_64 depends on msys2-mingw64), but MSYS2
      # builds FLINT only for ucrt64, clang64 and clangarm64: there is no
      # mingw-w64-x86_64-flint. Build FLINT for MINGW64 from the release,
      # without AVX2 so that the result runs on any x86_64.
      - name: Build FLINT 3.6.0 for MINGW64
        shell: C:\msys64\usr\bin\bash.exe --login -eo pipefail {0}
        env:
          MSYSTEM: MINGW64
          CHERE_INVOKING: 1
        run: |
          pacman -S --noconfirm --needed mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-gcc mingw-w64-x86_64-gmp mingw-w64-x86_64-mpfr mingw-w64-x86_64-pkgconf
          curl -sSL -o flint.tar.gz https://github.com/flintlib/flint/releases/download/v3.6.0/flint-3.6.0.tar.gz
          tar xzf flint.tar.gz -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/flint-3.6.0" -B "$RUNNER_TEMP/flint-build" -G Ninja \
            -DCMAKE_INSTALL_PREFIX=/mingw64 -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_ARCH=NO -DENABLE_AVX2=OFF -DBUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/flint-build"
          cmake --install "$RUNNER_TEMP/flint-build"
          pkg-config --modversion flint
          pkg-config --cflags --libs flint
          grep -n "FLINT_LONG_LONG\|FLINT_BITS" /mingw64/include/flint/flint-config.h || true

      # conf-flint.3.0's MSYS2 depext names a package that does not exist
      # for MINGW64: pin a copy without it (FLINT is installed above).
      - name: Pin conf-flint without the MSYS2 depext
        run: opam pin add -n -y --kind=path conf-flint .github/conf-flint

      - name: Install flint dependencies (depext installs mingw-w64 FLINT)
        run: opam install . --deps-only --with-test --confirm-level=unsafe-yes

      - name: Build flint
        run: opam exec -- dune build

      - name: Test flint
        run: opam exec -- dune runtest

      - name: Install mlcuddidl (colibri2 dependency)
        id: cudd
        continue-on-error: true
        run: opam install mlcuddidl --confirm-level=unsafe-yes

      - name: Install mlbdd (pure OCaml BDD library)
        id: mlbdd
        continue-on-error: true
        run: opam install mlbdd --confirm-level=unsafe-yes

      - name: Summary
        run: |
          Write-Host "mlcuddidl: ${{ steps.cudd.outcome }}"
          Write-Host "mlbdd: ${{ steps.mlbdd.outcome }}"
